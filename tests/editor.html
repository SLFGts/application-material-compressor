<!doctype html><meta charset="utf-8"><title>Editor regression</title><link rel="stylesheet" href="../style.css?v=editor2"><h1>统一编辑器回归</h1><pre id="report">Running…</pre><script src="../page-edit.js?v=editor2"></script><script>
(async()=>{
 const html=await(await fetch('../index.html?v=editor2')).text(),parsed=new DOMParser().parseFromString(html,'text/html');document.body.append(parsed.getElementById('page-editor'));
 const $=id=>document.getElementById(id),checks=[];const assert=(value,name)=>{if(!value)throw Error(name);checks.push(name);};
 const click=id=>$(id).click();const wait=()=>new Promise(r=>setTimeout(r,0));const ready=async()=>{for(let i=0;i<100&&$('editor-save').disabled;i++)await wait();if($('editor-save').disabled)throw Error('Editor failed to load');};
 const input=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new Event('input'));$(id).dispatchEvent(new Event('change'));};
 let commits=0;
 PageEdit.init({onBusy:()=>{},waitThumbnails:()=>Promise.resolve(),renderOriginal:async item=>{const c=document.createElement('canvas');c.width=item.width;c.height=item.height;const x=c.getContext('2d');x.fillStyle='#e8d4a0';x.fillRect(0,0,c.width,c.height);x.fillStyle='#332211';x.fillRect(0,0,50,50);return c;},onCommit:(item,draft,all,history)=>{commits++;item.edits={crop:draft.crop,overlays:draft.overlays};item.orientation=draft.orientation;item.editHistory=history;}});
 const item={id:'photo',fileName:'test.png',kind:'png',width:400,height:300};
 await PageEdit.open(item);await ready();assert($('editor-undo').disabled&&$('editor-redo').disabled,'Initial empty history');assert($('editor-apply-all-row').hidden,'Image hides PDF scope');
 input('crop-x','10');input('crop-w','70');document.querySelector('.editor-precision').open=true;$('crop-w').focus();$('crop-w').value='60';$('crop-w').dispatchEvent(new Event('input'));$('page-editor').dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true,bubbles:true}));assert($('crop-w').value==='70','Keyboard undo flushes active field');$('page-editor').dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true,shiftKey:true,bubbles:true}));assert($('crop-w').value==='60','Keyboard redo updates field');input('crop-w','70');click('editor-direction-mode');click('editor-rotate-right');click('editor-flip-horizontal');assert($('editor-direction-status').textContent.includes('90°'),'Rotation reflected');
 click('editor-undo');assert($('editor-flip-horizontal').getAttribute('aria-pressed')==='false','Undo flip');click('editor-redo');assert($('editor-flip-horizontal').getAttribute('aria-pressed')==='true','Redo flip');
 click('editor-reset-page');assert($('crop-x').value==='0'&&$('crop-w').value==='100'&&$('editor-direction-status').textContent==='旋转 0°','Restore resets all');click('editor-undo');assert($('crop-x').value==='10'&&$('crop-w').value==='70','Restore is undoable');
 click('editor-close');assert(commits===0&&!item.edits&&!item.orientation,'Cancel isolates draft');
 await PageEdit.open(item);await ready();assert($('editor-undo').disabled,'Cancelled history discarded');click('editor-image-mode');
 const stamp=document.createElement('canvas');stamp.width=stamp.height=40;stamp.getContext('2d').fillRect(0,0,40,40);const blob=await new Promise(r=>stamp.toBlob(r));const dt=new DataTransfer();dt.items.add(new File([blob],'stamp.png',{type:'image/png'}));$('editor-image-file').files=dt.files;$('editor-image-file').dispatchEvent(new Event('change'));await ready();
 assert($('editor-image-list').children.length===1,'Image accepts sticker');click('editor-undo');assert($('editor-image-list').children.length===0,'Undo sticker add');click('editor-redo');assert($('editor-image-list').children.length===1,'Redo sticker add');
 click('editor-image-list');$('editor-image-list').firstElementChild.click();input('image-x','8');click('editor-delete-image');assert($('editor-image-list').children.length===0,'Delete sticker');click('editor-undo');assert($('editor-image-list').children.length===1,'Undo sticker delete');
 click('editor-direction-mode');click('editor-rotate-right');click('editor-save');assert(commits===1&&item.edits.overlays.length===1&&item.orientation.rotation===90,'Save all edits together');
 const url=item.edits.overlays[0].url;await PageEdit.open(item);await ready();assert(!$('editor-undo').disabled,'History survives reopen');click('editor-reset-page');click('editor-save');assert(!item.edits.overlays.length&&item.orientation.rotation===0,'Save original state');
 await PageEdit.open(item);await ready();click('editor-undo');click('editor-image-mode');assert($('editor-image-list').children.length===1,'Reopen undo restores sticker');const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('History image URL revoked'));im.src=url;});assert(im.naturalWidth===40,'History retains sticker resource');
 click('editor-undo');click('editor-direction-mode');click('editor-rotate-left');assert($('editor-redo').disabled,'New branch clears redo');click('editor-close');assert(item.orientation.rotation===0&&item.edits.overlays.length===0,'Cancel history navigation preserves saved result');
 const pdf={id:'pdf',kind:'pdf',fileName:'test.pdf',page:2,width:300,height:400};await PageEdit.open(pdf);await ready();assert(!$('editor-apply-all-row').hidden,'PDF scope retained');assert($('editor-page-name').textContent.includes('第 2 页'),'PDF page identified');assert($('editor-undo').disabled,'Object histories independent');input('crop-x','15');click('editor-save');
 PageEdit.applyCrop(item,{x:.1,y:.1,w:.8,h:.8});assert(item.editHistory.states[item.editHistory.index].crop.w===.8,'Batch crop has independent history');
 await PageEdit.open(item);await ready();click('editor-undo');click('editor-save');assert(item.edits.crop.w===1,'Undo batch crop');
 document.getElementById('report').textContent=JSON.stringify({status:'PASS',checks:checks.length,details:checks},null,2);document.title='PASS editor';
})().catch(e=>{document.getElementById('report').textContent=e.stack;document.title='FAIL editor';});
</script>
