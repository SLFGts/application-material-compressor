<!doctype html><meta charset="utf-8"><title>File workflow regression</title><h1>文件与页面层级回归</h1><pre id="report">Running…</pre><iframe id="app" src="../index.html?v=files4" style="position:absolute;left:-10000px;width:1280px;height:900px" title="测试工作台"></iframe><script>
(async()=>{
 const frame=document.getElementById('app');await new Promise(r=>frame.onload=r);const w=frame.contentWindow,d=w.document,checks=[];const assert=(v,m)=>{if(!v)throw Error(m);checks.push(m);};
 const wait=async fn=>{for(let i=0;i<1000;i++){if(fn())return;await new Promise(r=>setTimeout(r,10));}throw Error('State timed out');};
 const click=id=>d.getElementById(id).click(),ready=()=>wait(()=>!d.getElementById('editor-save').disabled),input=(id,v)=>{const n=d.getElementById(id);n.value=v;n.dispatchEvent(new w.Event('input'));n.dispatchEvent(new w.Event('change'));};
 const pdf=await w.PDFLib.PDFDocument.create();for(let i=1;i<=3;i++)pdf.addPage(w.Array.of(240,320)).drawText('PAGE '+i,{x:30,y:200,size:24});
 const canvas=d.createElement('canvas');canvas.width=120;canvas.height=80;canvas.getContext('2d').fillRect(0,0,120,80);const blob=await new Promise(r=>canvas.toBlob(r));
 await w.addFiles([new w.File([await pdf.save()],'three.pdf',{type:'application/pdf'}),new w.File([blob],'photo.png',{type:'image/png'})]);
 const pdfCard=()=>Array.from(d.querySelectorAll('.file-card')).find(n=>n.querySelector('.item-label').textContent==='three.pdf');
 assert(d.querySelectorAll('.file-card').length===2,'One card per input file');assert(pdfCard().querySelector('.file-page-badge').textContent==='3 页','PDF count on one card');assert(!d.getElementById('queue'),'Duplicate file list removed');
 pdfCard().querySelector('.item-edit-button').click();await ready();assert(d.querySelectorAll('.editor-page-tile').length===3,'Pages appear only inside editor');
 input('crop-x','10');d.querySelector('[aria-label="编辑第 2 页"]').click();await ready();click('editor-direction-mode');click('editor-rotate-right');click('editor-page-up');const first=d.querySelector('[aria-label="导出第 1 页"]');first.checked=false;first.dispatchEvent(new w.Event('change'));click('editor-save');
 assert(d.querySelectorAll('.file-card').length===2,'Editing never splits outer cards');assert(pdfCard().querySelector('input').indeterminate,'Partial page selection reflected on file');assert(pdfCard().querySelector('.file-meta').textContent.includes('已选 2 页'),'Selected page count reflected');
 const photoCard=Array.from(d.querySelectorAll('.file-card')).find(n=>n.querySelector('.item-label').textContent==='photo.png');photoCard.querySelector('[data-move="-1"]').click();assert(d.querySelector('.file-card .item-label').textContent==='photo.png','File order changes as a group');
 d.querySelector('[data-format="pdf"]').click();click('convert');await wait(()=>!d.getElementById('results').hidden&&!d.getElementById('convert').disabled);
 const link=d.querySelector('#cards a'),result=await w.pdfjsLib.getDocument({data:new w.Uint8Array(await(await fetch(link.href)).arrayBuffer())}).promise;
 assert(result.numPages===3,'Export contains selected pages plus image');const text=await(await result.getPage(2)).getTextContent();assert(text.items.some(i=>i.str==='PAGE 2'),'Export respects file order and internal page order');assert((await result.getPage(2)).getViewport({scale:1}).width> (await result.getPage(2)).getViewport({scale:1}).height,'Page edit survives grouping');
 const before=d.getElementById('result-note').textContent;pdfCard().querySelector('.item-edit-button').click();await ready();d.querySelector('[aria-label="编辑第 3 页"]').click();await ready();input('crop-x','30');const one=d.querySelector('[aria-label="导出第 1 页"]');one.checked=true;one.dispatchEvent(new w.Event('change'));click('editor-page-up');click('editor-close');assert(d.getElementById('result-note').textContent===before,'Cancel keeps exported signature unchanged');assert(pdfCard().querySelector('.file-meta').textContent.includes('已选 2 页'),'Cancel discards page selection changes');
 const check=pdfCard().querySelector('input');check.checked=false;check.dispatchEvent(new w.Event('change'));assert(pdfCard().querySelector('.file-meta').textContent.includes('已选 0 页'),'File checkbox deselects all pages');check.checked=true;check.dispatchEvent(new w.Event('change'));assert(pdfCard().querySelector('.file-meta').textContent.includes('已选 3 页'),'File checkbox selects all pages');
 pdfCard().querySelector('.file-remove').click();await wait(()=>d.querySelectorAll('.file-card').length===1);assert(d.querySelector('.file-card .item-label').textContent==='photo.png','Remove PDF removes whole file');
 await result.destroy();document.getElementById('report').textContent=JSON.stringify({status:'PASS',checks:checks.length,details:checks},null,2);document.title='PASS files';
})().catch(e=>{document.getElementById('report').textContent=e.stack;document.title='FAIL files';});
</script>
